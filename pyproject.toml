[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandwich-trace-core"
version = "0.1.0"
description = "Offline Ethereum sandwich attack detection and evaluation core"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "SandwichTrace-Core_38 contributors" },
]
dependencies = [
  "pydantic>=2.5,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
]

[project.scripts]
sandwich-trace = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = [
  "application*",
  "contracts*",
  "core*",
  "dataset*",
  "evaluation*",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

